name: "Автоматический релиз L-MPV"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Настройка Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэширование сборок Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Установка npm-зависимостей
        run: npm ci

      - name: Загрузка и распаковка внешних библиотек (libmpv-2.dll, ffmpeg.exe, mediainfo.dll)
        shell: pwsh
        run: |
          Write-Host "Скачивание зависимостей из релиза deps-v1..."
          Invoke-WebRequest -Uri "https://github.com/Menely/L-MPV/releases/download/deps-v1/mpv_libs.zip" -OutFile "mpv_libs.zip"
          Write-Host "Распаковка в src-tauri..."
          Expand-Archive -Path mpv_libs.zip -DestinationPath src-tauri/ -Force
          Write-Host "Распаковка в корень..."
          Expand-Archive -Path mpv_libs.zip -DestinationPath ./ -Force
          Remove-Item mpv_libs.zip -Force

          # Проверка наличия и целостности всех трех нативных компонентов
          if (-not (Test-Path "src-tauri/libmpv-2.dll") -or -not (Test-Path "src-tauri/ffmpeg.exe") -or -not (Test-Path "src-tauri/mediainfo.dll")) {
            throw "КРИТИЧЕСКАЯ ОШИБКА: Нативные зависимости отсутствуют в каталоге src-tauri!"
          }
          Write-Host "Все нативные зависимости успешно проверены (libmpv-2.dll с vf_animejanai, ffmpeg.exe, mediainfo.dll)."

      - name: Синхронизация версии из Git-тега в package.json и Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          if ($ver -match '^\d+\.\d+\.\d+') {
            Write-Host "Установка версии $ver из тега $tag..."
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $pkg.version = $ver
            $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

            (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*?"', "version = `"$ver`"" | Set-Content src-tauri/Cargo.toml
          }

      - name: Сборка и публикация релиза Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'L-MPV v__VERSION__'
          releaseBody: 'Автоматический релиз медиаплеера L-MPV с поддержкой Real-Time 4K AI Upscaling (DirectML / TensorRT).'
          releaseDraft: false
          prerelease: false

      - name: Публикация портативного архива и автономного l-mpv.exe в релиз
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -notmatch '^v\d+') {
            $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          Write-Host "Подготовка полноценного портативного дистрибутива..."
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/models/onnx" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/inference" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/config/presets" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/screenshots" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/fonts" | Out-Null
          Copy-Item "src/assets/fonts/*" -Destination "Portable-L-MPV/fonts/" -Force
          
          Copy-Item "src-tauri/target/release/l-mpv.exe" -Destination "Portable-L-MPV/l-mpv.exe" -Force
          Copy-Item "libmpv-2.dll" -Destination "Portable-L-MPV/libmpv-2.dll" -Force
          Copy-Item "ffmpeg.exe" -Destination "Portable-L-MPV/ffmpeg.exe" -Force
          Copy-Item "mediainfo.dll" -Destination "Portable-L-MPV/mediainfo.dll" -Force
          
          $portableZip = "L-MPV-$tag-portable.zip"
          Write-Host "Создание архива $portableZip..."
          Compress-Archive -Path "Portable-L-MPV/*" -DestinationPath $portableZip -Force
          
          Write-Host "Загрузка артефактов в релиз $tag..."
          gh release upload $tag $portableZip --clobber
          gh release upload $tag "src-tauri/target/release/l-mpv.exe#l-mpv.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
