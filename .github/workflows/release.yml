name: "Автоматический релиз L-MPV"
run-name: "Релиз ${{ inputs.version_tag != '' && inputs.version_tag || github.ref_name }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Тег версии (например, v2.7.0). Если пусто — берётся из package.json'
        required: false
        default: ''
      include_ffmpeg:
        description: 'Прикрепить отдельный ffmpeg.exe (для обновления у пользователей)'
        type: boolean
        default: false
      include_mediainfo:
        description: 'Прикрепить отдельный mediainfo.dll (для обновления у пользователей)'
        type: boolean
        default: false
      include_libmpv:
        description: 'Прикрепить отдельный libmpv-2.dll (для обновления у пользователей)'
        type: boolean
        default: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v7

      - name: Настройка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Настройка Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэширование сборок Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Установка npm-зависимостей
        run: npm ci

      - name: Python для проверки полученного комплекта deps-v1
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64

      - name: Загрузка и распаковка внешних библиотек (libmpv-2.dll, ffmpeg.exe, mediainfo.dll)
        shell: pwsh
        run: |
          Write-Host "Скачивание зависимостей из релиза deps-v1..."
          Invoke-WebRequest -Uri "https://github.com/Menely/L-MPV/releases/download/deps-v1/mpv_libs.zip" -OutFile "mpv_libs.zip"
          Write-Host "Распаковка в src-tauri/binaries/..."
          Expand-Archive -Path mpv_libs.zip -DestinationPath src-tauri/binaries/ -Force
          Remove-Item mpv_libs.zip -Force

          # Проверка наличия, целостности и обновление LastWriteTime всех трех нативных компонентов
          $binFiles = @("src-tauri/binaries/libmpv-2.dll", "src-tauri/binaries/ffmpeg.exe", "src-tauri/binaries/mediainfo.dll")
          foreach ($f in $binFiles) {
            if (-not (Test-Path $f)) { throw "КРИТИЧЕСКАЯ ОШИБКА: Нативные зависимости отсутствуют в каталоге src-tauri/binaries! Нет файла: $f" }
            $item = Get-Item $f
            if ($item.Length -eq 0) { throw "КРИТИЧЕСКАЯ ОШИБКА: файл $f пуст!" }
            $item.LastWriteTime = Get-Date
          }
          Invoke-WebRequest -Uri "https://github.com/Menely/L-MPV/releases/download/deps-v1/dependency-sources.json" -OutFile "deps-sources.json"
          $sources = Get-Content deps-sources.json -Raw | ConvertFrom-Json
          $pins = Get-Content scripts/animejanai-dependencies.json -Raw | ConvertFrom-Json
          $expectedMpv = "https://github.com/the-database/mpv-winbuild/releases/download/$($pins.mpv_release)/$($pins.mpv_asset)"
          if ($sources.libmpv -ne $expectedMpv) { throw "deps-v1 содержит другой libmpv. Сначала обновите deps-v1." }
          if ($sources.ffmpeg -notmatch '/ffmpeg-(\d{4}-\d{2}-\d{2}-git-[a-f0-9]+)-essentials_build\.7z$') { throw "Неверный источник FFmpeg в deps-v1" }
          $ffmpegTag = $Matches[1]
          if ($sources.mediainfo -notmatch '/libmediainfo0/(\d+\.\d+(?:\.\d+)?)/') { throw "Неверный источник MediaInfo в deps-v1" }
          $mediaInfoVersion = $Matches[1]
          python scripts/verify-native-dependencies.py src-tauri/binaries --ffmpeg-tag $ffmpegTag --mediainfo-version $mediaInfoVersion
          if ($LASTEXITCODE -ne 0) { throw "deps-v1 не соответствует версиям/архитектуре текущей сборки" }
          Write-Host "Все нативные зависимости успешно проверены (libmpv-2.dll с vf_animejanai, ffmpeg.exe, mediainfo.dll)."

      - name: Синхронизация версии из Git-тега в package.json и Cargo.toml
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.version_tag }}"
          $tag = if ($inputTag) { $inputTag } else { "${{ github.ref_name }}" }
          $ver = $tag -replace '^v', ''
          if ($ver -match '^\d+\.\d+\.\d+') {
            Write-Host "Установка версии $ver из тега $tag..."
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $pkg.version = $ver
            $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

            (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*?"', "version = `"$ver`"" | Set-Content src-tauri/Cargo.toml
          }

      - name: Сборка и публикация релиза Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'L-MPV v__VERSION__'
          releaseBody: 'Автоматический релиз медиаплеера L-MPV с поддержкой Real-Time 4K AI Upscaling (DirectML / TensorRT).'
          releaseDraft: false
          prerelease: false

      - name: Публикация портативного архива и выбранных компонентов
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.version_tag }}"
          $tag = if ($inputTag) { $inputTag } else { "${{ github.ref_name }}" }
          if (-not $tag -or $tag -notmatch '^v\d+') {
            $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          Write-Host "Подготовка полноценного портативного дистрибутива..."
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/models/onnx" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/inference" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/config/presets" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/screenshots" | Out-Null
          New-Item -ItemType Directory -Force -Path "Portable-L-MPV/fonts" | Out-Null
          Copy-Item "src/assets/fonts/*" -Destination "Portable-L-MPV/fonts/" -Force
          
          Copy-Item "src-tauri/target/release/l-mpv.exe" -Destination "Portable-L-MPV/l-mpv.exe" -Force
          Copy-Item "src-tauri/binaries/libmpv-2.dll" -Destination "Portable-L-MPV/libmpv-2.dll" -Force
          Copy-Item "src-tauri/binaries/ffmpeg.exe" -Destination "Portable-L-MPV/ffmpeg.exe" -Force
          Copy-Item "src-tauri/binaries/mediainfo.dll" -Destination "Portable-L-MPV/mediainfo.dll" -Force

          # Определение выбранных чекбоксами компонентов для отдельного обновления
          $isTagPush = ("${{ github.event_name }}" -eq "push")
          $includeFfmpeg = $isTagPush -or ("${{ github.event.inputs.include_ffmpeg }}" -eq "true")
          $includeMediainfo = $isTagPush -or ("${{ github.event.inputs.include_mediainfo }}" -eq "true")
          $includeLibmpv = $isTagPush -or ("${{ github.event.inputs.include_libmpv }}" -eq "true")

          # Верификация того, что скомпилированный l-mpv.exe содержит точный BLAKE3-хэш упакованного libmpv-2.dll
          Push-Location src-tauri
          $libmpvJson = & cargo run --release -q --example gen_checksums -- "../Portable-L-MPV/libmpv-2.dll" | Out-String | ConvertFrom-Json
          Pop-Location
          $expectedMpvHash = $libmpvJson.files."libmpv-2.dll"
          $exeAscii = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("Portable-L-MPV/l-mpv.exe"))
          if (-not $exeAscii.Contains($expectedMpvHash)) {
            throw "КРИТИЧЕСКАЯ ОШИБКА ЦЕЛОСТНОСТИ: В скомпилированном l-mpv.exe отсутствует BLAKE3-хэш ($expectedMpvHash) текущего libmpv-2.dll!"
          }
          Write-Host "Проверка целостности пройдена: l-mpv.exe содержит актуальный хэш libmpv-2.dll ($expectedMpvHash)."

          # Формирование списка файлов для манифеста checksums.json и загрузки в релиз
          $publishAssets = @("Portable-L-MPV/l-mpv.exe")
          if ($includeFfmpeg) { $publishAssets += "Portable-L-MPV/ffmpeg.exe" }
          if ($includeMediainfo) { $publishAssets += "Portable-L-MPV/mediainfo.dll" }
          if ($includeLibmpv) { $publishAssets += "Portable-L-MPV/libmpv-2.dll" }

          Write-Host "Файлы, выбранные для автообновления: $($publishAssets -join ', ')"

          Write-Host "Генерация манифеста целостности checksums.json..."
          Push-Location src-tauri
          $argsList = @("run", "--release", "-q", "--example", "gen_checksums", "--", "-o", "../checksums.json") + ($publishAssets | ForEach-Object { "../$_" })
          & cargo $argsList
          Pop-Location

          Copy-Item "checksums.json" -Destination "Portable-L-MPV/checksums.json" -Force

          $portableZip = "L-MPV-$tag-portable.zip"
          Write-Host "Создание архива $portableZip..."
          Compress-Archive -Path "Portable-L-MPV/*" -DestinationPath $portableZip -Force
          
          Write-Host "Загрузка артефактов в релиз $tag..."
          gh release upload $tag $portableZip --clobber
          gh release upload $tag "checksums.json#checksums.json" --clobber

          foreach ($assetPath in $publishAssets) {
            $fileName = Split-Path -Leaf $assetPath
            Write-Host "Загрузка $fileName в релиз..."
            gh release upload $tag "${assetPath}#${fileName}" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

