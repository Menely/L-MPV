name: "Автоматический релиз L-MPV"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Настройка Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэширование сборок Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Установка npm-зависимостей
        run: npm ci

      - name: Загрузка и распаковка внешних библиотек (libmpv-2.dll, ffmpeg.exe, mediainfo.dll)
        shell: pwsh
        run: |
          Write-Host "Скачивание зависимостей из релиза deps-v1..."
          Invoke-WebRequest -Uri "https://github.com/Menely/L-MPV/releases/download/deps-v1/mpv_libs.zip" -OutFile "mpv_libs.zip"
          Write-Host "Распаковка в src-tauri..."
          Expand-Archive -Path mpv_libs.zip -DestinationPath src-tauri/ -Force
          Write-Host "Распаковка в корень..."
          Expand-Archive -Path mpv_libs.zip -DestinationPath ./ -Force
          Remove-Item mpv_libs.zip -Force

      - name: Синхронизация версии из Git-тега в package.json и Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          if ($ver -match '^\d+\.\d+\.\d+') {
            Write-Host "Установка версии $ver из тега $tag..."
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $pkg.version = $ver
            $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

            (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*?"', "version = `"$ver`"" | Set-Content src-tauri/Cargo.toml
          }

      - name: Сборка портативного l-mpv.exe
        shell: pwsh
        run: |
          npm run tauri build -- --no-bundle

      - name: Публикация портативного релиза в GitHub Releases
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -notmatch '^v\d+') {
            $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          Write-Host "Публикация автономного файла l-mpv.exe в релиз $tag..."
          gh release create $tag "src-tauri/target/release/l-mpv.exe#l-mpv.exe" --title "L-MPV $tag" --notes "Автоматический портативный релиз медиаплеера L-MPV на базе libmpv." --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
