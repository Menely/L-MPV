name: "Автоматический релиз L-MPV"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Настройка Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кэширование сборок Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Установка npm-зависимостей
        run: npm ci

      - name: Загрузка и распаковка внешних библиотек (libmpv-2.dll и ffmpeg.exe)
        shell: pwsh
        run: |
          Write-Host "Скачивание библиотек из релиза deps-v1..."
          Invoke-WebRequest -Uri "https://github.com/Menely/L-MPV/releases/download/deps-v1/mpv_libs.zip" -OutFile "mpv_libs.zip"
          Write-Host "Распаковка в src-tauri..."
          Expand-Archive -Path mpv_libs.zip -DestinationPath src-tauri/ -Force
          Write-Host "Распаковка в корень..."
          Expand-Archive -Path mpv_libs.zip -DestinationPath ./ -Force
          Remove-Item mpv_libs.zip -Force

      - name: Сборка и публикация релиза Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'L-MPV ${{ github.ref_name }}'
          releaseBody: 'Автоматический релиз медиаплеера L-MPV на базе libmpv.'
          releaseDraft: false
          prerelease: false
