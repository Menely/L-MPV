name: "Загрузка зависимостей (deps-v1)"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deps-v1-publication
  cancel-in-progress: false

jobs:
  upload-deps:
    runs-on: windows-latest

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v7

      - name: Python для проверки версий нативных DLL
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64

      - name: Свежие FFmpeg и MediaInfo, libmpv для AnimeJaNai 3.9.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/package-dependencies.ps1 -Kind Native

      - name: Публикация/Обновление релиза deps-v1 на GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: deps-v1
          name: "L-MPV Build Dependencies v1"
          body: "Автоматически собранные нативные библиотеки libmpv-2.dll (от the-database/mpv-winbuild с vf_animejanai), ffmpeg.exe (от gyan.dev) и MediaInfo.dll для сборки L-MPV."
          files: |
            mpv_libs.zip
            dependency-sources.json
            dependency-versions.json
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
