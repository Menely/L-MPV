name: "Загрузка инференс-движков (inference-v1)"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inference-v1-publication
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v7

      - name: Установка Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64

      - name: Установка зависимостей Python
        run: pip install onnx onnxconverter-common pyinstaller

      - name: Компиляция convert_fp16.exe
        shell: pwsh
        run: |
          Write-Host "Компиляция нативного конвертера FP16..."
          pyinstaller --onefile scripts/convert_fp16.py
          if ($LASTEXITCODE -ne 0) { throw "Сборка конвертера завершилась ошибкой" }
          Move-Item -Path "dist/convert_fp16.exe" -Destination "l-mpv_convert_fp16.exe" -Force
          Compress-Archive -Path "l-mpv_convert_fp16.exe" -DestinationPath "l-mpv_convert_fp16.zip" -Force
          if ((Get-Item "l-mpv_convert_fp16.zip").Length -lt 100KB) { throw "Архив конвертера пуст или повреждён" }
          Write-Host "Готово! l-mpv_convert_fp16.zip создан."

      - name: Загрузка и проверка комплекта AnimeJaNai 3.10.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/package-dependencies.ps1 -Kind Inference

      - name: Публикация релиза inference-v1 на GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: inference-v1
          name: "L-MPV Inference Engines v1"
          body_path: inference-release-notes.md
          files: |
            l-mpv_convert_fp16.zip
            aji-windows-x64.zip
            component-trt-runtime.7z
            component-trt-sm*.7z
            component-trt-ptx.7z
            dependency-sources.json
            inference-release-notes.md
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
